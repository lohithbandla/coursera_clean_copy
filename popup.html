<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 600px;
      height: 500px;
      padding: 20px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 15px;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
    }
    .button-group {
      margin: 10px 0;
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    #removeBtn {
      background-color: #4CAF50;
      color: white;
    }
    #removeBtn:hover {
      background-color: #45a049;
    }
    #copyBtn {
      background-color: #2196F3;
      color: white;
    }
    #copyBtn:hover {
      background-color: #0b7dda;
    }
    #clearBtn {
      background-color: #f44336;
      color: white;
    }
    #clearBtn:hover {
      background-color: #da190b;
    }
    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      display: none;
      font-weight: bold;
    }
    .success {
      background-color: #d4edda;
      color: #155724;
    }
    .info {
      background-color: #d1ecf1;
      color: #0c5460;
    }
    .warning {
      background-color: #fff3cd;
      color: #856404;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>📝 Coursera Clean Copy</h3>
  
  <label>Input Text:</label>
  <textarea id="inputText" placeholder="Paste your text here..."></textarea>
  
  <div class="button-group">
    <button id="removeBtn">Produce Clean Text</button>
    <button id="copyBtn">Copy Result</button>
    <button id="clearBtn">Clear All</button>
  </div>
  
  <label>Output Text:</label>
  <textarea id="outputText" placeholder="Cleaned text will appear here..." readonly></textarea>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
